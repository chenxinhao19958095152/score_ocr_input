name: Build Windows EXE
on: push
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 解压zip项目包
        run: |
          Expand-Archive -Path .\score_ocr_input.zip -DestinationPath .\ -Force

      - name: 安装Python3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装全部依赖（清华源）
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller paddlepaddle paddleocr paddlex pandas openpyxl opencv-python -i https://pypi.tuna.tsinghua.edu.cn/simple
      
      - name: PyInstaller打包（不带-w，保留控制台窗口）
        run: |
          pyinstaller "成绩录入系统电脑端.py" --collect-all paddleocr --collect-all paddlex --collect-all paddle --add-data "grade_tool;grade_tool"
      
      - name: 上传打包产物dist
        uses: actions/upload-artifact@v4
        with:
          name: dist打包结果
          path: dist
