name: 构建Windows EXE

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      # 解压zip，把你的项目释放出来
      - name: 解压项目zip包
        shell: pwsh
        run: |
          if (Test-Path ".\score_ocr_input.zip") {
            Expand-Archive -Path .\score_ocr_input.zip -DestinationPath .\ -Force
            Write-Host "✅ zip解压完成"
          } else {
            throw "❌ 仓库找不到 score_ocr_input.zip"
          }

      # 递归搜索主py文件，保存路径给后面打包使用
      - name: 查找主Python脚本
        shell: pwsh
        id: find_script
        run: |
          $script = Get-ChildItem -Path . -Recurse -Filter "成绩录入系统电脑端.py" | Select-Object -First 1
          if (-not $script) {
            throw "❌ 解压后没有找到主脚本：成绩录入系统电脑端.py"
          }
          Write-Host "✅ 找到主脚本：$($script.FullName)"
          echo "script_path=$($script.FullName)" >> $env:GITHUB_OUTPUT

      - name: 配置Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装pip依赖
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller paddlex paddleocr paddlepaddle

      # 打包，自动带上grade_tool文件夹
      - name: PyInstaller打包（包含grade_tool工具包）
        shell: pwsh
        run: |
          pyinstaller "${{ steps.find_script.outputs.script_path }}" `
            --collect-all paddleocr `
            --collect-all paddlex `
            --collect-all paddle `
            --add-data "grade_tool;grade_tool"

      - name: 上传打包好的exe产物
        uses: actions/upload-artifact@v4
        with:
          name: 打包后的EXE
          path: dist/*.exe
